# =============================================================================
# CI/CD for Financee
# -----------------------------------------------------------------------------
# checks  : fast static gate — django check + missing-migration guard.
# test    : builds the PRODUCTION image, boots the real compose stack
#           (Postgres seeds build_multitenant_db.sql, entrypoint runs public
#           migrations + production_hardening.sql exactly like production),
#           provisions a second tenant, and runs every test harness inside the
#           container. The full suite runs on every push and PR by design.
# publish : (inside test, main only) pushes the *tested* image to GHCR tagged
#           with the commit SHA + latest.
# deploy  : (main only) waits for manual approval via the `production` GitHub
#           environment, then SSHes to the EC2 host and runs
#           deploy/deploy_pull.sh with the SHA tag — the server never rebuilds.
#
# One-time repo setup (documented in README "CI/CD"):
#   * Settings -> Environments -> New environment "production" -> add yourself
#     as a required reviewer (this is the manual approval gate).
#   * Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY (private key), and optional
#     EC2_APP_DIR (defaults to ~/Financee_Multitenant_Production).
#   * On the EC2 host, either make the GHCR package public or run a one-time
#     `docker login ghcr.io` with a read:packages PAT.
# =============================================================================
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE_BASE: ghcr.io/maaz-bin-haider/financee-web

jobs:
  checks:
    name: Django checks & migration guard
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      DB_NAME: financee
      DB_USER: financee
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Byte-compile the tree
        run: python -m compileall -q .
      - name: Django system checks
        run: python manage.py check
      - name: Fail if a model change is missing its migration
        run: python manage.py makemigrations --check --dry-run

  test:
    name: Build image & run full suite in the real stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway CI env file
        run: |
          cat > deploy/.env <<'EOF'
          SECRET_KEY=ci-only-not-secret-but-long-enough-for-django
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=http://localhost
          DB_NAME=financee
          DB_USER=financee
          DB_PASSWORD=ci-postgres-password
          DB_HOST=db
          DB_PORT=5432
          EOF

      - name: Build the production image
        run: docker compose -f deploy/docker-compose.yml build web

      - name: Boot the stack (DB seeds bootstrap SQL, entrypoint migrates + hardens)
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for web to be healthy
        run: |
          cid=$(docker compose -f deploy/docker-compose.yml ps -q web)
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "web never became healthy"; exit 1

      - name: Copy test harnesses into the container
        run: docker compose -f deploy/docker-compose.yml cp tests web:/app/

      - name: Bootstrap superuser, second tenant, and tenant users
        # The suite discovers tenants through tenancy_membership (one tenant
        # user per company is required), mirroring the local twin-tenant setup.
        run: |
          docker compose -f deploy/docker-compose.yml exec -T \
            -e DJANGO_SUPERUSER_USERNAME=admin \
            -e DJANGO_SUPERUSER_PASSWORD=ci-admin-password \
            -e DJANGO_SUPERUSER_EMAIL=admin@example.com \
            web python manage.py createsuperuser --noinput
          docker compose -f deploy/docker-compose.yml exec -T \
            web python manage.py provision_tenant "CI Company Two"
          docker compose -f deploy/docker-compose.yml exec -T \
            web python tests/ci_bootstrap.py

      - name: Comprehensive suite (every domain, every report, both tenants)
        run: docker compose -f deploy/docker-compose.yml exec -T web python tests/suite/run_all.py

      - name: SQL business-function harness
        run: docker compose -f deploy/docker-compose.yml exec -T web python tests/test_system.py

      - name: HTTP endpoint harness
        run: docker compose -f deploy/docker-compose.yml exec -T web python tests/test_http.py

      - name: Deep transaction-lifecycle harness
        run: docker compose -f deploy/docker-compose.yml exec -T web python tests/test_transaction_lifecycle_deep.py

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color > stack-logs.txt || true
      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: stack-logs.txt

      # ── Publish the exact tested image (main pushes only) ──────────────────
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push tested image (sha + latest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "$IMAGE_BASE:latest" "$IMAGE_BASE:${{ github.sha }}"
          docker push "$IMAGE_BASE:${{ github.sha }}"
          docker push "$IMAGE_BASE:latest"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v || true

  deploy:
    name: Deploy to EC2 (manual approval)
    # DEPLOY_ENABLED is a repo *variable* (Settings -> Secrets and variables ->
    # Actions -> Variables). Leave it unset until the EC2 secrets and the
    # `production` environment reviewer are configured, so CI stays green
    # meanwhile; set it to `true` to activate deploys.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [checks, test]
    runs-on: ubuntu-latest
    # The approval gate: configure the `production` environment in repo
    # settings with a required reviewer. The job pauses here until approved.
    environment: production
    concurrency: production-deploy
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Pull-deploy the tested image on the server
        run: |
          APP_DIR="${{ secrets.EC2_APP_DIR }}"
          APP_DIR="${APP_DIR:-\$HOME/Financee_Multitenant_Production}"
          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd $APP_DIR/deploy && git pull --ff-only && WEB_IMAGE='$IMAGE_BASE:${{ github.sha }}' bash deploy_pull.sh"
