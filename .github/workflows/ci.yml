name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE_BASE: ghcr.io/maaz-bin-haider/financee-web

jobs:
  checks:
    name: Static, Django, migration & release-contract checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      DB_NAME: financee
      DB_USER: financee
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m compileall -q .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python tests/phase0_serial_only_discovery_contracts.py
      - run: python tests/phase1_serial_only_creation_contracts.py
      - run: python tests/phase2_serial_runtime_removal_contracts.py
      - run: python tests/phase3_metadata_inventory_contracts.py
      - run: python tests/phase3a_compatibility_contracts.py
      - run: python tests/phase3b_cleanup_contracts.py
      - run: python tests/phase3b_executor_contracts.py
      - run: python tests/phase4_repository_hygiene_contracts.py
      - run: python -m unittest tests.test_phase3_inventory_remote
      - run: python -m unittest tests.test_phase3_recovery_remote
      - run: python -m unittest tests.test_phase3b_cleanup_remote
      - run: python -m unittest tests.test_phase4_inventory_remote
      - run: python -m unittest tests.test_phase2_static_retirement
      - run: python tests/phase27_release_gates.py
      - run: bash tests/phase27_rollback_simulation.sh
      - run: python tests/phase28_release_gates.py
      - run: python tests/phase29_security_contracts.py
      - run: python tests/phase30_release_gates.py
      - run: python tests/database_backup_contracts.py
      - run: python tests/test_database_backup_retention.py
      - run: python tests/test_database_backup_operations.py
      - run: python tests/test_database_backup_restore_contracts.py
      - run: python -m pip check

  serial-gate:
    name: Serial regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh serial
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-gate-failure
          path: phase27-artifacts/serial

  creation-freeze-gate:
    name: Serial-only company creation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh creation-freeze
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: creation-freeze-gate-failure
          path: phase27-artifacts/creation-freeze

  runtime-removal-gate:
    name: Serial-only runtime removal gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh runtime-removal
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-removal-gate-failure
          path: phase27-artifacts/runtime-removal

  metadata-inventory-gate:
    name: Phase 3 read-only metadata inventory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/ci_phase27_stack.sh metadata-inventory
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-inventory-gate-failure
          path: phase27-artifacts/metadata-inventory

  compatibility-gate:
    name: Phase 3A old and new image compatibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/ci_phase27_stack.sh compatibility
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3a-compatibility-evidence
          path: phase27-artifacts/compatibility

  cleanup-rehearsal-gate:
    name: Phase 3B reversible cleanup and contracted-database regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test cleanup and actual 3A rollback with synthetic data only
        run: |
          set -euo pipefail
          docker pull ghcr.io/maaz-bin-haider/financee-web:497b6650ed678bc462f85de6bff14692bffd6ace
          docker pull postgres:16
          docker pull redis:7-alpine
          python3 tests/phase3_recovery_local.py --cleanup-test
          python3 tests/phase3_recovery_local.py --executor-test

  isolation-gate:
    name: Four-serial-company isolation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh isolation
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-gate-failure
          path: phase27-artifacts/isolation

  arm64-smoke:
    name: ARM64 image execution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build loadable ARM64 production image
        run: |
          docker buildx build --platform linux/arm64 \
            -f deploy/Dockerfile -t financee-arm64-smoke:ci --load .
      - name: Execute migration, provisioning and HTTP smoke under ARM64
        env:
          WEB_IMAGE: financee-arm64-smoke:ci
        run: |
          chmod +x tests/ci_phase27_stack.sh
          tests/ci_phase27_stack.sh arm64
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-smoke-failure
          path: phase27-artifacts/arm64

  full-regression:
    name: Complete production-stack regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dedicated serial/creation-freeze/isolation jobs are mandatory focused
      # gates. Run the aggregate suite once on one health-checked clean stack.
      - name: Run complete suite
        run: |
          chmod +x tests/ci_phase27_stack.sh
          tests/ci_phase27_stack.sh full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-failure
          path: phase27-artifacts/full

  recovery-gate:
    name: Encrypted backup, restore & rollback gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse encrypted recovery and old-image compatibility
        env:
          PHASE28_ARTIFACT_DIR: phase28-artifacts
        run: |
          chmod +x deploy/backup_encrypted.sh deploy/restore_rehearsal.sh
          chmod +x tests/phase28_recovery_rehearsal.sh
          tests/phase28_recovery_rehearsal.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase28-encrypted-recovery-evidence
          path: phase28-artifacts
          retention-days: 14

  staging-security-gate:
    name: Phase 29 exact-image staging, security & UAT gate
    runs-on: ubuntu-latest
    needs: [checks, recovery-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Run production-like staging acceptance
        env:
          PHASE29_ARTIFACT_DIR: phase29-artifacts
        run: |
          chmod +x tests/phase29_staging_acceptance.sh
          tests/phase29_staging_acceptance.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase29-staging-security-evidence
          path: phase29-artifacts
          retention-days: 30

  staging-release-approval:
    name: Product, engineering & operations staging approval
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [staging-security-gate, serial-gate, creation-freeze-gate, runtime-removal-gate, metadata-inventory-gate, compatibility-gate, cleanup-rehearsal-gate, isolation-gate, arm64-smoke, full-regression, recovery-gate]
    runs-on: ubuntu-latest
    environment: staging-release-approval
    steps:
      - name: Record approved release candidate
        run: |
          echo "Approved Phase 29 release candidate: ${{ env.IMAGE_BASE }}:${{ github.sha }}"
          echo "The protected environment approval is the product/engineering/operations sign-off record."

  publish:
    name: Publish signed-off multi-architecture image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks, serial-gate, creation-freeze-gate, runtime-removal-gate, metadata-inventory-gate, compatibility-gate, cleanup-rehearsal-gate, isolation-gate, arm64-smoke, full-regression, recovery-gate, staging-security-gate, staging-release-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish immutable SHA and convenience latest manifests
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile \
            --cache-from "type=registry,ref=$IMAGE_BASE:latest" \
            --cache-to type=inline \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            -t "$IMAGE_BASE:latest" --push .

  deploy:
    name: Deploy to EC2 (manual approval)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [publish, full-regression]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-deploy
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Pull-deploy the SHA-pinned tested source
        run: |
          APP_DIR="${{ secrets.EC2_APP_DIR }}"
          APP_DIR="${APP_DIR:-\$HOME/Financee_Multitenant_Production}"
          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd $APP_DIR/deploy && git pull --ff-only && \
             WEB_IMAGE='$IMAGE_BASE:${{ github.sha }}' \
             PHASE30_RELEASE_SHA='${{ github.sha }}' \
             PHASE30_CHANGE_ID='github-${{ github.run_id }}' \
             PHASE30_NOTICE_REFERENCE='${{ vars.MAINTENANCE_NOTICE_REFERENCE || format('github-production-approval-{0}', github.run_id) }}' \
             PHASE30_MAINTENANCE_WINDOW='${{ vars.MAINTENANCE_WINDOW_UTC || format('approved-production-run-{0}', github.run_id) }}' \
             PHASE30_ROLLBACK_OWNER='${{ vars.ROLLBACK_OWNER || github.actor }}' \
             PHASE30_BACKUP_MODE='${{ vars.PHASE30_BACKUP_MODE || 'external' }}' \
             BACKUP_DEST='${{ secrets.BACKUP_DEST }}' \
             BACKUP_PASSPHRASE_FILE='${{ secrets.BACKUP_PASSPHRASE_FILE }}' \
             bash phase30_foundation_deploy.sh"
