name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE_BASE: ghcr.io/maaz-bin-haider/financee-web

jobs:
  checks:
    name: Static, Django, migration & release-contract checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      DB_NAME: financee
      DB_USER: financee
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m compileall -q .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python tests/phase27_release_gates.py
      - run: bash tests/phase27_rollback_simulation.sh

  serial-gate:
    name: Serial regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh serial
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-gate-failure
          path: phase27-artifacts/serial

  quantity-gate:
    name: Quantity complete-suite gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh quantity
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quantity-gate-failure
          path: phase27-artifacts/quantity

  isolation-gate:
    name: Four-company isolation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x tests/ci_phase27_stack.sh
      - run: tests/ci_phase27_stack.sh isolation
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-gate-failure
          path: phase27-artifacts/isolation

  arm64-smoke:
    name: ARM64 image execution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build loadable ARM64 production image
        run: |
          docker buildx build --platform linux/arm64 \
            -f deploy/Dockerfile -t financee-arm64-smoke:ci --load .
      - name: Execute migration, provisioning and HTTP smoke under ARM64
        env:
          WEB_IMAGE: financee-arm64-smoke:ci
        run: |
          chmod +x tests/ci_phase27_stack.sh
          tests/ci_phase27_stack.sh arm64
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-smoke-failure
          path: phase27-artifacts/arm64

  full-regression:
    name: Complete production-stack regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run aggregate gate and preserve exact module failure
        run: |
          chmod +x tests/ci_phase27_stack.sh
          tests/ci_phase27_stack.sh quantity
      # The separate serial/quantity/isolation jobs are the mandatory release
      # gates. This job preserves the all-module CI behavior after they pass.
      - name: Full suite
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          docker compose -f deploy/docker-compose.yml cp tests web:/app/
          docker compose -f deploy/docker-compose.yml exec -T \
            -e DJANGO_SUPERUSER_USERNAME=admin \
            -e DJANGO_SUPERUSER_PASSWORD=ci-admin-password \
            -e DJANGO_SUPERUSER_EMAIL=admin@example.com \
            web python manage.py createsuperuser --noinput
          docker compose -f deploy/docker-compose.yml exec -T \
            web python manage.py provision_tenant "CI Company Two"
          docker compose -f deploy/docker-compose.yml exec -T \
            web python tests/ci_bootstrap.py
          docker compose -f deploy/docker-compose.yml exec -T web \
            python tests/suite/run_all.py
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v || true

  publish:
    name: Publish signed-off multi-architecture image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks, serial-gate, quantity-gate, isolation-gate, arm64-smoke, full-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish immutable SHA and convenience latest manifests
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile \
            --cache-from "type=registry,ref=$IMAGE_BASE:latest" \
            --cache-to type=inline \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            -t "$IMAGE_BASE:latest" --push .

  deploy:
    name: Deploy to EC2 (manual approval)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [publish, full-regression]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-deploy
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Pull-deploy the SHA-pinned tested source
        run: |
          APP_DIR="${{ secrets.EC2_APP_DIR }}"
          APP_DIR="${APP_DIR:-\$HOME/Financee_Multitenant_Production}"
          ssh -i ~/.ssh/id_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd $APP_DIR/deploy && git pull --ff-only && WEB_IMAGE='$IMAGE_BASE:${{ github.sha }}' bash deploy_pull.sh"
