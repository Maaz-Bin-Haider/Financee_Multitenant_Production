# =============================================================================
# financee.conf  —  HTTP server (port 80).
# -----------------------------------------------------------------------------
# Behind Cloudflare in "Full (strict)" mode, external visitors reach the origin
# over HTTPS on port 443 (see financee_tls.conf, mounted only on the server by
# docker-compose.tls.yml). This port-80 server stays up because:
#   * the deploy health check curls  http://localhost/authentication/login/,
#   * the container healthcheck curls http://localhost:8000/...  (web direct),
#   * it is the plain-HTTP origin fallback before TLS is installed.
#
# All the real proxy/static/media config lives in financee_common.conf so the
# HTTP and HTTPS servers share one source of truth and cannot drift. Cloudflare
# performs the HTTP->HTTPS redirect for visitors at the edge ("Always Use
# HTTPS"), so this server does not redirect — a blanket redirect here would also
# 301 the localhost health checks.
# =============================================================================
server {
    listen 80;
    server_name _;            # Cloudflare sets Host; matched by default server

    include /etc/nginx/snippets/financee_common.conf;
}
