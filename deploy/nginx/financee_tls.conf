# =============================================================================
# financee_tls.conf  —  HTTPS server (port 443), Cloudflare Origin Certificate.
# -----------------------------------------------------------------------------
# Mounted into /etc/nginx/conf.d/ ONLY on the EC2 host, by docker-compose.tls.yml,
# and ONLY once the origin cert exists at /etc/nginx/cloudflare/ (the deploy
# scripts add the overlay automatically when they detect origin.pem). It shares
# its body with the HTTP server via financee_common.conf.
#
# Cloudflare SSL/TLS mode MUST be "Full (strict)" so the edge validates this
# certificate. The cert/key are a free Cloudflare Origin CA pair (valid up to
# 15 years, no renewal) — server-only secrets, never committed to git.
#   Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create Certificate
#   save cert  -> /etc/nginx/cloudflare/origin.pem
#   save key   -> /etc/nginx/cloudflare/origin.key   (chmod 600, root)
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name financee-swisstech.com www.financee-swisstech.com;

    ssl_certificate     /etc/nginx/cloudflare/origin.pem;
    ssl_certificate_key /etc/nginx/cloudflare/origin.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # HSTS — safe now that HTTPS is the real entry point end-to-end (browser ->
    # Cloudflare -> origin all HTTPS). Cloudflare forwards this to the browser.
    # Add ; preload only if you also submit the domain to the HSTS preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/financee_common.conf;
}
