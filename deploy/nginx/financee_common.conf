# =============================================================================
# financee_common.conf  —  shared server body.
# -----------------------------------------------------------------------------
# Included by BOTH servers:
#   * the HTTP server (port 80) in financee.conf, and
#   * the HTTPS server (port 443) in financee_tls.conf.
# Keeping the proxy/static/media locations in ONE place means the two servers
# can never drift apart (this project has been bitten by drift before).
#
# Mounted at /etc/nginx/snippets/  — NOT /etc/nginx/conf.d/, which nginx
# auto-loads as standalone server blocks (this file is a partial, not a server).
# HSTS is intentionally NOT here: it belongs only on the HTTPS server.
#
# The STALE-UPSTREAM resolver fix (2026-07-08) lives in `location /` below:
# Docker's embedded DNS + a variable proxy_pass re-resolves `web` per request,
# so the web container can be recreated on every deploy without a 502.
# =============================================================================

# --- upload size (invoices can carry many line items / serials) --------------
client_max_body_size 25m;

# --- compression -------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css application/javascript application/json
    application/xml image/svg+xml font/woff font/woff2;

# --- security headers (baseline; tune CSP to your asset origins) -------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# =============================================================================
# STATIC FILES
# -----------------------------------------------------------------------------
# ManifestStaticFilesStorage renames every asset to <name>.<hash>.<ext>; the
# hash is content-derived, so hashed URLs are safe to cache FOREVER (immutable).
# Non-hashed fallbacks revalidate hourly. HTML from Django is never cached here.
# =============================================================================
location /static/ {
    alias /app/staticfiles/;          # shared volume populated by the image
    access_log off;

    # Hashed assets:  name.<8+ hex>.ext  -> cache for a year, immutable.
    location ~* "\.[0-9a-f]{8,}\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else under /static (non-hashed fallback): revalidate hourly.
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    try_files $uri =404;
}

# Private media is NEVER served by nginx — streamed only via authed Django.
location ^~ /media/private/ {
    return 404;
}

location /media/ {
    alias /app/media/;
    expires 7d;
    add_header Cache-Control "public";
}

# =============================================================================
# APPLICATION
# =============================================================================
location / {
    # Docker's embedded DNS + a variable target: nginx re-resolves `web`
    # per `valid=` window instead of pinning the container IP at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $financee_app web;
    proxy_pass http://$financee_app:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Lets Django know the original scheme so CSRF/secure cookies work. On the
    # HTTPS server $scheme is "https", so SECURE_PROXY_SSL_HEADER trips and
    # request.is_secure() is True end-to-end (Cloudflare -> origin is HTTPS too).
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    65s;   # >= Gunicorn timeout so slow reports survive
}
