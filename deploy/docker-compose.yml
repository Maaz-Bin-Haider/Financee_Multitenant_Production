# =============================================================================
# docker-compose.yml  —  single-EC2 production stack
# -----------------------------------------------------------------------------
#   db    : PostgreSQL 16, data on a named volume, tuned via command flags.
#   web   : Django + Gunicorn (image from ./Dockerfile). Static baked at build.
#   nginx : reverse proxy + static serving, shares the web image's static tree
#           through the `staticfiles` volume.
#
# The `staticfiles` volume is populated from the web image at build (collectstatic
# wrote /app/staticfiles) and mounted read-only into nginx so both see the same
# hashed files + manifest.
# =============================================================================
services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ONE-TIME bootstrap: this runs ONLY when pgdata is empty (first boot).
      # It builds the public schema (auth/django/tenancy) + example tenant
      # schema tenant_company_1. After that, `migrate` (in the web entrypoint)
      # applies the authentication permission migrations. Ignored on later boots.
      - ../build_multitenant_db.sql:/docker-entrypoint-initdb.d/01_build.sql:ro
    # Phase 26 baseline for the real t4g.medium: 2 vCPU / 4 GiB, with DB,
    # Redis, web, and nginx co-located. work_mem is per sort/hash operation, so
    # keep it deliberately small under the 100-session T7 load.
    command:
      - "postgres"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"          # SSD/gp3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # CI pushes the tested image here; deploys pull it instead of rebuilding
    # on the server. Local `--build` still works and tags the result with this
    # name. Override WEB_IMAGE to pin a specific SHA tag (deploy_pull.sh does).
    image: ${WEB_IMAGE:-ghcr.io/maaz-bin-haider/financee-web:latest}
    restart: unless-stopped
    # Production/default remains deploy/.env. Isolated restore rehearsals set
    # WEB_ENV_FILE to their non-production credential file so web and the
    # disposable PostgreSQL service use the same database credentials.
    env_file: ${WEB_ENV_FILE:-.env}
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/authentication/login/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
      # 443 is published by docker-compose.tls.yml on the server once the
      # Cloudflare origin cert is installed — see DEPLOYMENT_GUIDE.md Part F.
    volumes:
      - ./nginx/financee.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared server body included by both the HTTP and (on the server) HTTPS
      # servers. Mounted under snippets/ so nginx does not auto-load the partial.
      - ./nginx/financee_common.conf:/etc/nginx/snippets/financee_common.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  staticfiles:
  media:
  redisdata:
