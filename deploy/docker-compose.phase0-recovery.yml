services:
  db:
    command:
      - "postgres"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
  web:
    environment:
      WEB_CONCURRENCY: "1"
      GUNICORN_THREADS: "2"
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
  redis:
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
