# Standalone local review stack. Never combine with production Compose files.
# Run through review_stack.py so names, credentials and ports are validated.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: financee_review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD:?Use review_stack.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../build_multitenant_db.sql:/docker-entrypoint-initdb.d/01_build.sql:ro
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=60]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U review -d financee_review]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${REVIEW_IMAGE:?Use review_stack.py}
    env_file: ${REVIEW_ENV_FILE:?Use review_stack.py}
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
      GUNICORN_THREADS: "2"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8000/authentication/login/]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  mailpit:
    image: axllent/mailpit:v1.27.8
    # No SMTP host port and no edge network: capture has no external egress.
    environment:
      MP_MAX_MESSAGES: "200"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
  report_worker:
    image: ${REVIEW_IMAGE:?Use review_stack.py}
    env_file: ${REVIEW_ENV_FILE:?Use review_stack.py}
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    entrypoint: [python, manage.py, run_report_scheduler]
    stop_grace_period: 90s
    depends_on:
      web:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, manage.py, run_report_scheduler, --health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  nginx:
    image: nginx:1.27
    # Docker Desktop does not publish ports on an internal-only network.
    # Only nginx joins this edge; the application/data services stay internal.
    networks: [default, review_edge]
    ports:
      - "127.0.0.1:${REVIEW_PORT:?Use review_stack.py}:80"
      - "127.0.0.1:${REVIEW_MAIL_PORT:-8182}:8025"
    volumes:
      - ./nginx/financee.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/review_mailpit.conf:/etc/nginx/conf.d/review_mailpit.conf:ro
      - ./nginx/financee_common.conf:/etc/nginx/snippets/financee_common.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
volumes:
  pgdata:
  staticfiles:
  media:
networks:
  default:
    # No outbound SMTP or access to another application's Docker network.
    internal: true
  review_edge:
